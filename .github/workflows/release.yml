# Releases happen on their own: push a commit to main that changes the version in
# PeerReview.toc and this workflow runs the tests, tags the commit, builds the zip and
# uploads it to CurseForge.
#
# The file "release-type" decides the release type: "beta" tags v<version>-beta (uploaded as a
# Beta file), "release" tags v<version>.
#
# Needs the repository secret CF_API_KEY. The project ID is in PeerReview.toc.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "PeerReview.toc"
      - "release-type"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          pip install lupa
          python tests/run.py

      - name: Work out the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^## Version: *//p' PeerReview.toc | tr -d '\r')
          kind=$(tr -d ' \r\n' < release-type 2>/dev/null || echo beta)
          if [ "$kind" = "release" ]; then tag="v$version"; else tag="v$version-beta"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A version counts as released once its GitHub release exists.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already released, nothing to do."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag this commit
        if: steps.tag.outputs.done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.tag.outputs.tag }}"
          git push -f origin "refs/tags/${{ steps.tag.outputs.tag }}"

      - name: Get the BigWigs packager
        if: steps.tag.outputs.done == 'false'
        uses: actions/checkout@v4
        with:
          repository: BigWigsMods/packager
          ref: v2
          path: .packager

      # The packager is run as a script so it can be told this is a tag build;
      # the workflow itself was started by a push to main.
      - name: Package and upload to CurseForge
        if: steps.tag.outputs.done == 'false'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GITHUB_REF="refs/tags/${{ steps.tag.outputs.tag }}"
          export GITHUB_REF_TYPE=tag
          export GITHUB_REF_NAME="${{ steps.tag.outputs.tag }}"
          bash .packager/release.sh
