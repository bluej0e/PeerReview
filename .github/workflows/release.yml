# Releases happen on their own: push a commit to main that changes the version in
# PeerReview.toc and this workflow runs the tests, tags the commit, builds the zip and
# uploads it to CurseForge.
#
# The file ".release" decides the release type: "beta" tags v<version>-beta (uploaded as a
# Beta file), "release" tags v<version>.
#
# Needs the repository secret CF_API_KEY. The project ID is in PeerReview.toc.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "PeerReview.toc"
      - ".release"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          pip install lupa
          python tests/run.py

      - name: Work out the tag
        id: tag
        run: |
          version=$(sed -n 's/^## Version: *//p' PeerReview.toc | tr -d '\r')
          kind=$(tr -d ' \r\n' < .release 2>/dev/null || echo beta)
          if [ "$kind" = "release" ]; then tag="v$version"; else tag="v$version-beta"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists, nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Package and upload to CurseForge
        if: steps.tag.outputs.exists == 'false'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
